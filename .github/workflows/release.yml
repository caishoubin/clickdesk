name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify core logic and publish portable app
        shell: pwsh
        run: ./build.ps1

      - name: Check Windows startup and clean shutdown
        shell: pwsh
        run: ./scripts/Test-WindowsStartup.ps1 -ExecutablePath ./dist/ClickDesk-Windows-x64/ClickDesk.exe

      - name: Package source and SHA-256 checksums
        shell: pwsh
        run: |
          git archive --format=zip --prefix=ClickDesk-source/ --output=dist/ClickDesk-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not package source.' }
          $checksums = Get-FileHash dist/ClickDesk-Windows-x64.zip, dist/ClickDesk-source.zip -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) }
          $checksums | Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM

      - name: Preserve downloadable build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClickDesk-Windows-x64
          path: |
            dist/ClickDesk-Windows-x64.zip
            dist/ClickDesk-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish tagged version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content src/ClickDesk/ClickDesk.csproj
          $version = $project.Project.PropertyGroup.Version | Where-Object { $_ }
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match the application version.' }

          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw 'This version is already published; do not overwrite it.' }
          } else {
            gh release create $env:RELEASE_TAG --verify-tag --draft `
              --title "ClickDesk $env:RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft.' }
          }

          gh release upload $env:RELEASE_TAG dist/ClickDesk-Windows-x64.zip dist/ClickDesk-source.zip dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release assets.' }
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release.' }
          "Published: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY

      - name: Update initial release description
        if: github.ref == 'refs/tags/v1.1.0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit v1.0.0 --notes-file docs/RELEASE-NOTES-v1.0.0.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not update the initial release description.' }
